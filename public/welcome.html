<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>欢迎使用时光机</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #2f54eb 0%, #1d39c4 100%);
        color: #fff;
      }
      .card {
        width: 420px;
        max-width: 92vw;
        background: rgba(255, 255, 255, 0.98);
        color: #1f2329;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }
      .logo { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
      .sub { color: #6b7280; font-size: 13px; margin-bottom: 22px; }
      .step-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
      .desc { font-size: 13px; color: #4b5563; line-height: 1.7; margin-bottom: 18px; }
      .strategy-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
      .option {
        display: flex; align-items: center; gap: 10px;
        border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 12px 14px; cursor: pointer;
      }
      .option:hover { border-color: #2f54eb; }
      .option input { accent-color: #2f54eb; }
      .option .name { font-weight: 600; font-size: 14px; }
      .option .hint { font-size: 12px; color: #6b7280; }
      .steps { display: flex; gap: 6px; margin-bottom: 22px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; }
      .dot.active { background: #2f54eb; width: 22px; border-radius: 4px; }
      .actions { display: flex; justify-content: flex-end; gap: 10px; }
      button {
        border: none; border-radius: 8px; padding: 9px 20px; font-size: 14px; cursor: pointer;
        background: #2f54eb; color: #fff; font-weight: 500;
      }
      button.secondary { background: #f3f4f6; color: #4b5563; }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">⏳ 时光机</div>
      <div class="sub">只看到指定时间点之前发布的帖子</div>

      <div class="steps" id="dots">
        <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
      </div>

      <!-- Step 1: 概念说明 -->
      <section class="step" data-step="0">
        <div class="step-title">设一个时间点，从此刻起，新帖子不再干扰你</div>
        <div class="desc">
          在股票社区里，盘中实时帖子 90% 是情绪噪音。设定截止时间后，
          只显示截止时间之前发布的帖子，之后的会被自动过滤——帮你回到"过去的视角"，
          冷静做判断。
        </div>
      </section>

      <!-- Step 2: 选择默认过滤策略 -->
      <section class="step" data-step="1" hidden>
        <div class="step-title">默认过滤策略</div>
        <div class="strategy-options">
          <label class="option">
            <input type="radio" name="strategy" value="hide" checked />
            <div><div class="name">隐藏</div><div class="hint">直接不显示，页面最干净（推荐）</div></div>
          </label>
          <label class="option">
            <input type="radio" name="strategy" value="collapse" />
            <div><div class="name">折叠</div><div class="hint">收成占位条，点击可展开查看（v1.0 提供）</div></div>
          </label>
        </div>
      </section>

      <!-- Step 3: 试用提示 -->
      <section class="step" data-step="2" hidden>
        <div class="step-title">试试在雪球上开启时光机</div>
        <div class="desc">
          打开雪球（xueqiu.com），点击浏览器工具栏的时光机图标，
          先设定截止时间，再开启过滤即可生效。
        </div>
      </section>

      <div class="actions">
        <button id="prev" class="secondary" hidden>上一步</button>
        <button id="next">下一步</button>
        <button id="finish" hidden>开始使用</button>
      </div>
    </div>

    <script src="welcome.js"></script>
  </body>
</html>
