<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时光机</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="popup">
      <header class="header">
        <span class="logo">⏳ 时光机</span>
        <div class="header-actions">
          <button id="settings-btn" class="icon-btn" type="button" title="打开设置" aria-label="打开设置">
            <i data-lucide="settings" aria-hidden="true"></i>
          </button>
          <button id="toggle-btn" class="toggle" disabled>—</button>
        </div>
      </header>

      <div id="auth-area" hidden>
        <p class="auth-text">此站点未授权，点击授权后即可使用</p>
        <button id="auth-btn" class="preset">授权此站点</button>
        <p id="auth-status" class="auth-status" role="status" hidden></p>
      </div>

      <p id="precision-hint" class="precision-hint" hidden>⚠️ 该平台为相对时间，精度 ±5 分钟</p>

      <section class="section time-section">
        <div class="mode-switch" role="radiogroup" aria-label="时间过滤模式">
          <label><input type="radio" name="time-mode" value="cutoff" checked /><span>截止</span></label>
          <label><input type="radio" name="time-mode" value="window" /><span>区间</span></label>
        </div>

        <div id="cutoff-panel" class="time-panel">
          <label class="field-label" for="cutoff-input">显示此时间及以前</label>
          <input id="cutoff-input" class="time-input" type="datetime-local" step="60" data-time-control />
          <div class="presets" id="cutoff-presets"></div>
        </div>

        <div id="window-panel" class="time-panel" hidden>
          <div class="window-grid">
            <label>
              <span class="field-label">开始时间</span>
              <input id="window-start-input" class="time-input" type="datetime-local" step="60" data-time-control />
            </label>
            <label>
              <span class="field-label">结束时间</span>
              <input id="window-end-input" class="time-input" type="datetime-local" step="60" data-time-control />
            </label>
          </div>
          <div class="presets window-presets">
            <button class="preset" data-window-preset="today">今天</button>
            <button class="preset" data-window-preset="yesterday">昨天</button>
            <button class="preset" data-window-preset="last_3_days">近3天</button>
            <button class="preset" data-window-preset="this_week">本周</button>
            <button class="preset" data-window-preset="lunch_review" title="今日 09:30–11:30">午间复盘</button>
            <button class="preset" data-window-preset="trading_session" title="今日 09:30–15:00">交易时段</button>
            <button class="preset" data-window-preset="trading_day" title="最近一个交易日全天（v1.0 按工作日处理，不含法定节假日）">交易日全天</button>
          </div>
        </div>
        <p id="time-error" class="field-error" role="alert" hidden></p>
      </section>

      <section class="section">
        <label class="field-label">过滤策略</label>
        <div class="strategy">
          <label class="radio"><input type="radio" name="strategy" value="hide" checked /> 隐藏</label>
          <label class="radio"><input type="radio" name="strategy" value="collapse" /> 折叠</label>
        </div>
      </section>

      <section id="diagnostics" class="diagnostics" hidden>
        <button id="diagnostics-toggle" class="diagnostics-toggle" type="button" aria-expanded="false">
          查看无法解析的时间
        </button>
        <div id="diagnostics-details" hidden>
          <ul id="diagnostics-list"></ul>
          <button id="copy-diagnostics-btn" class="preset" type="button">复制诊断报告</button>
        </div>
      </section>

      <p id="scope-status" class="scope-status" hidden></p>

      <footer class="footer">
        <div class="site" id="site">当前站点: —</div>
        <div class="count" id="count">已过滤: 0 条</div>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
