<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时光机 - 设置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand-mark" aria-hidden="true">⏳</div>
        <div>
          <h1>时光机设置</h1>
          <p class="version" id="subtitle">v0.1.0</p>
        </div>
      </div>
    </header>

    <div class="settings-layout">
      <nav class="settings-nav" aria-label="设置分类">
        <a href="#general" class="active">通用</a>
        <a href="#comments">评论过滤</a>
        <a href="#sites">站点与适配</a>
        <a href="#advanced">高级</a>
      </nav>

      <main class="settings-main">
        <section id="general" class="settings-section">
          <div class="section-heading">
            <h2>通用</h2>
            <p>控制默认过滤方式和页面提示。</p>
          </div>
          <div class="setting-list">
            <label class="setting-row">
              <span class="setting-copy">
                <strong>默认过滤策略</strong>
                <small>首次为站点设置截止时间时使用</small>
              </span>
              <select id="pref-strategy">
                <option value="hide">隐藏</option>
                <option value="collapse">折叠</option>
              </select>
            </label>
            <label class="setting-row">
              <span class="setting-copy">
                <strong>角标显示计数</strong>
                <small>在扩展图标上显示已过滤条数</small>
              </span>
              <span class="switch-control">
                <input id="pref-badge" type="checkbox" checked />
                <span class="switch-track" aria-hidden="true"></span>
              </span>
            </label>
            <label class="setting-row">
              <span class="setting-copy">
                <strong>悬浮提示条</strong>
                <small>在网页右下角显示截止时间与过滤计数</small>
              </span>
              <span class="switch-control">
                <input id="pref-banner" type="checkbox" />
                <span class="switch-track" aria-hidden="true"></span>
              </span>
            </label>
          </div>
        </section>

        <section id="comments" class="settings-section">
          <div class="section-heading">
            <h2>评论过滤</h2>
            <p>评论优先按自身时间过滤，无法判断时间时使用下方规则。</p>
          </div>
          <div class="setting-list">
            <label class="setting-row">
              <span class="setting-copy">
                <strong>无法解析时间的评论</strong>
                <small>“全部显示”可以避免误隐藏内容</small>
              </span>
              <select id="pref-comment-notime">
                <option value="show">全部显示（推荐）</option>
                <option value="collapse">默认折叠</option>
              </select>
            </label>
          </div>
        </section>

        <section id="sites" class="settings-section">
          <div class="section-heading">
            <h2>站点与适配</h2>
            <p>按平台管理授权与查看页面能力；时间设置按站点记忆。</p>
          </div>
          <div class="subsection">
            <div class="sites-actions">
              <button id="grant-all-btn" class="grant-all-btn" type="button">授权全部金融站点</button>
              <small class="sites-actions-note">仅在点击时弹窗申请授权，安装时绝不自动申请</small>
            </div>
            <ul id="site-list" class="status-list"></ul>
            <p id="site-action-status" class="site-action-status" role="status" hidden></p>
            <div id="other-origins" class="other-origins" hidden>
              <h4>其他已授权来源</h4>
              <ul id="other-origins-list" class="status-list"></ul>
            </div>
            <p class="section-note">移除后该站点将停止过滤，再次使用时可从扩展弹窗或本页重新授权。</p>
          </div>
          <div class="subsection">
            <h3>适配包</h3>
            <ul id="adapter-list" class="status-list"></ul>
          </div>
        </section>

        <section id="advanced" class="settings-section">
          <div class="section-heading">
            <h2>高级</h2>
            <p>适配包更新失败时会自动使用扩展内置版本。</p>
          </div>
          <div class="setting-list">
            <label class="setting-row">
              <span class="setting-copy">
                <strong>自动更新适配包</strong>
                <small>每 12 小时检查一次平台规则更新</small>
              </span>
              <span class="switch-control">
                <input id="pref-autoupdate" type="checkbox" checked />
                <span class="switch-track" aria-hidden="true"></span>
              </span>
            </label>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
