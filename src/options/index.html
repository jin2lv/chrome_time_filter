<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时光机 - 设置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="options">
      <h1>⏳ 时光机设置</h1>
      <p class="subtitle" id="subtitle">v0.1.0（开发版）</p>

      <section>
        <h2>通用</h2>
        <label class="row">
          <span>默认过滤策略</span>
          <select id="pref-strategy">
            <option value="hide">隐藏</option>
            <option value="collapse">折叠</option>
          </select>
        </label>
        <label class="row">
          <span>角标显示计数</span>
          <input id="pref-badge" type="checkbox" checked />
        </label>
        <label class="row">
          <span>悬浮提示条（页面右下角，P2-8）</span>
          <input id="pref-banner" type="checkbox" />
        </label>
      </section>

      <section>
        <h2>评论过滤（P2-4）</h2>
        <label class="row">
          <span>评论无时间戳时的处理</span>
          <select id="pref-comment-notime">
            <option value="show">全部显示（推荐）</option>
            <option value="collapse">默认折叠</option>
          </select>
        </label>
        <p class="desc">帖子详情页评论按自身时间戳独立过滤；无法解析时间戳的评论按此策略处理。</p>
      </section>

      <section>
        <h2>已授权站点</h2>
        <ul id="permission-list" class="permission-list"></ul>
        <p class="desc">移除授权后，该站点的过滤将停止生效；再次访问时可在扩展弹窗中重新授权。</p>
      </section>

      <section>
        <h2>适配包</h2>
        <ul id="adapter-list" class="permission-list"></ul>
      </section>

      <section>
        <h2>高级</h2>
        <label class="row">
          <span>适配包自动更新（每 12h）</span>
          <input id="pref-autoupdate" type="checkbox" checked />
        </label>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
